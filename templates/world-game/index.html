<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Open world</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0f; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 12px; top: 12px; color: #e8eaef;
      font: 600 13px/1.5 system-ui, sans-serif; text-shadow: 0 1px 3px #000;
      pointer-events: none; max-width: 320px;
    }
    #hud small { opacity: 0.75; font-weight: 500; }
  </style>
</head>
<body>
  <div id="hud">World · loading…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
