<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gamemaster</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #12141a;
      --border: #23262f;
      --text: #e8eaef;
      --muted: #8b92a5;
      --accent: #6ee7b7;
      --accent2: #38bdf8;
      --user: #1a2332;
      --bot: #141820;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #152033 0%, transparent 50%),
                  radial-gradient(900px 500px at 100% 0%, #0f2a22 0%, transparent 45%),
                  var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(11,12,16,.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center;
      font-weight: 800; color: #062016; font-size: 14px;
      box-shadow: 0 0 24px rgba(110,231,183,.25);
    }
    .brand h1 { margin: 0; font-size: 16px; letter-spacing: -0.02em; }
    .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .header-right { display: flex; align-items: center; gap: 8px; }
    button.gh {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    button.gh:hover { border-color: #3a4152; }
    button.gh.on { border-color: rgba(110,231,183,.4); color: var(--accent); }
    .modal-bg {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(0,0,0,.55);
      display: none; place-items: center;
      padding: 20px;
    }
    .modal-bg.show { display: grid; }
    .modal {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 18px 16px;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
    }
    .modal h2 { margin: 0 0 6px; font-size: 16px; }
    .modal p { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .modal label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; }
    .modal input, .modal textarea {
      width: 100%; background: #0b0c10; color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font: inherit; font-size: 13px;
    }
    .modal .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .modal .row button { flex: 1; min-width: 110px; height: 40px; border-radius: 10px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: #18181f; color: var(--text); }
    .modal .row button.primary { background: var(--accent); color: #042f1c; border: 0; }
    .modal .code {
      font: 700 22px/1.2 ui-monospace, Menlo, monospace;
      letter-spacing: .12em; color: var(--accent); margin: 8px 0 12px;
    }
    .modal .err { color: var(--danger); font-size: 12px; min-height: 1.2em; }
    .status {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted);
      padding: 6px 10px; border: 1px solid var(--border);
      border-radius: 999px; background: var(--panel);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
    .dot.ok { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot.bad { background: var(--danger); }
    main {
      flex: 1;
      overflow: auto;
      padding: 20px;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      margin: 0 0 14px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      line-height: 1.55;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { background: var(--user); margin-left: 12%; }
    .msg.bot { background: var(--bot); margin-right: 8%; }
    .msg.system {
      background: transparent; border-style: dashed;
      color: var(--muted); text-align: center; font-size: 13px;
    }
    .msg .role {
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); margin-bottom: 8px; font-weight: 600;
    }
    .msg.bot .role { color: var(--accent); }
    .msg.user .role { color: var(--accent2); }
    .msg pre {
      background: #0a0c11;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      overflow-x: auto;
      font-size: 12.5px;
      line-height: 1.45;
      margin: 10px 0 0;
    }
    .msg code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .msg p { margin: 0 0 8px; }
    .msg p:last-child { margin-bottom: 0; }
    footer {
      border-top: 1px solid var(--border);
      background: rgba(11,12,16,.92);
      padding: 14px 16px 18px;
    }
    .composer {
      max-width: 880px; margin: 0 auto;
      display: flex; gap: 10px; align-items: flex-end;
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 52px; max-height: 180px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font: inherit;
      outline: none;
      line-height: 1.4;
    }
    textarea:focus { border-color: #3a4152; box-shadow: 0 0 0 3px rgba(56,189,248,.12); }
    button.send {
      appearance: none; border: 0;
      background: linear-gradient(135deg, var(--accent), #34d399);
      color: #052e1c;
      font-weight: 700;
      border-radius: 14px;
      padding: 0 18px;
      height: 52px;
      cursor: pointer;
      min-width: 100px;
    }
    button.send:disabled { opacity: .5; cursor: not-allowed; }
    .hints {
      max-width: 880px; margin: 10px auto 0;
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .hints button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .hints button:hover { color: var(--text); border-color: #3a4152; }
    .typing { color: var(--muted); font-size: 13px; padding: 4px 8px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">3J</div>
      <div>
        <h1>Gamemaster</h1>
        <p>Games · Solana Seeker · all genres · local · $0</p>
      </div>
    </div>
    <div class="header-right">
      <button type="button" class="gh" id="btnGh">GitHub</button>
      <div class="status" id="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">checking…</span>
      </div>
    </div>
  </header>

  <div class="modal-bg" id="ghModal" role="dialog" aria-label="GitHub">
    <div class="modal">
      <h2 id="ghTitle">GitHub</h2>
      <p id="ghLead">Sign in to commit and push your games.</p>
      <div class="code" id="ghCode" hidden></div>
      <label for="ghProject">Game folder</label>
      <input id="ghProject" type="text" placeholder="/Users/you/Gamemaster/Projects/Wilds" />
      <label for="ghMsg">Commit message</label>
      <input id="ghMsg" type="text" placeholder="feat: vertical slice" />
      <label class="check" style="display:flex;align-items:center;gap:8px;margin-top:10px">
        <input id="ghPrivate" type="checkbox" checked /> Private repo
      </label>
      <label for="ghToken">Or paste a PAT (repo scope)</label>
      <input id="ghToken" type="password" autocomplete="off" placeholder="ghp_…" />
      <div class="err" id="ghErr"></div>
      <div class="row">
        <button type="button" id="ghLogin">Sign in</button>
        <button type="button" class="primary" id="ghShip">Ship game</button>
        <button type="button" id="ghClose">Close</button>
      </div>
    </div>
  </div>

  <main id="log">
    <div class="msg system">Describe what you want to build — e.g. „Third-Person Controller mit Jump“. Enter to send · Shift+Enter for newline.</div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="2" placeholder="What should go in the game? e.g. FPS controller, enemy spawner, inventory…"></textarea>
      <button class="send" id="send">Send</button>
    </div>
    <div class="hints">
      <button data-q="Explain Studio multi-agent: council vs build vs parallel for a new arena game">Studio help</button>
      <button data-q="Vertical Slice Design: Core Verb + 3 Pillars + feel numbers for a one-thumb runner">Director</button>
      <button data-q="FragCoord multipass Shader Lab BufferA feedback + Image composite">Shader Lab</button>
      <button data-q="Solana Seeker Idle Game MWA Connect + Claim Button">Seeker Idle</button>
      <button data-q="Platformer Coyote Time Jump Buffer Screen Shake Juice">Platformer</button>
    </div>
  </footer>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const MODEL = 'gamemaster';
    const history = [];

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderMarkdownLite(text) {
      // code fences
      let html = '';
      const parts = text.split(/(```[\s\S]*?```)/g);
      for (const part of parts) {
        if (part.startsWith('```')) {
          const m = part.match(/^```(\w+)?\n?([\s\S]*?)```$/);
          const code = m ? m[2] : part.slice(3, -3);
          html += '<pre><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>';
        } else {
          const lines = escapeHtml(part).split(/\n/);
          let buf = [];
          const flush = () => {
            if (buf.length) {
              html += '<p>' + buf.join('<br>') + '</p>';
              buf = [];
            }
          };
          for (const line of lines) {
            if (line.trim() === '') flush();
            else buf.push(line.replace(/`([^`]+)`/g, '<code>$1</code>'));
          }
          flush();
        }
      }
      return html || escapeHtml(text);
    }

    function addMsg(role, content, streaming = false) {
      const el = document.createElement('div');
      el.className = 'msg ' + role;
      const label = role === 'user' ? 'You' : role === 'bot' ? 'Gamemaster' : '';
      el.innerHTML = (label ? `<div class="role">${label}</div>` : '') +
        (role === 'bot' || role === 'user'
          ? `<div class="body">${role === 'bot' ? renderMarkdownLite(content) : escapeHtml(content)}</div>`
          : escapeHtml(content));
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function setStatus(ok, text) {
      dot.className = 'dot ' + (ok === true ? 'ok' : ok === false ? 'bad' : '');
      statusText.textContent = text;
    }

    let healthBusy = false;
    async function checkHealth() {
      if (healthBusy) return false;
      healthBusy = true;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4000);
      try {
        const r = await fetch('/api/health', { signal: ctrl.signal, cache: 'no-store' });
        const d = await r.json();
        if (d.backend === 'cloud' && d.ok) {
          setStatus(true, 'cloud · ' + (d.provider || '') + ' · ' + (d.model || '') + ' · paid');
          return true;
        }
        if (d.ok) {
          setStatus(true, 'online · ' + (d.model || MODEL) + ' · $0');
          return true;
        }
        if (!d.ollama) {
          setStatus(false, 'Ollama not answering — open Ollama.app');
          return false;
        }
        setStatus(false, 'Model missing — Terminal: cd ~/gamemaster && ./install.sh');
        return false;
      } catch (e) {
        setStatus(false, 'offline — start Ollama (or gamemaster cloud on grok)');
        return false;
      } finally {
        clearTimeout(timer);
        healthBusy = false;
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = '';
      addMsg('user', text);
      history.push({ role: 'user', content: text });
      sendBtn.disabled = true;

      const botEl = addMsg('bot', '…');
      const bodyEl = botEl.querySelector('.body');
      let full = '';

      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: MODEL,
            messages: history.slice(-12),
            stream: true,
          }),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop() || '';
          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const j = JSON.parse(line);
              const t = j.message?.content || '';
              if (t) {
                full += t;
                bodyEl.innerHTML = renderMarkdownLite(full);
                log.scrollTop = log.scrollHeight;
              }
            } catch (_) {}
          }
        }
        if (!full) full = '(keine Antwort)';
        bodyEl.innerHTML = renderMarkdownLite(full);
        history.push({ role: 'assistant', content: full });
      } catch (e) {
        bodyEl.textContent = 'Error: ' + e.message + '

Tip: open Ollama.app, then reload this page.';
        setStatus(false, 'Verbindungsfehler');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    document.querySelectorAll('.hints button').forEach(b => {
      b.addEventListener('click', () => {
        input.value = b.dataset.q;
        input.focus();
      });
    });

    const ghModal = document.getElementById('ghModal');
    const ghBtn = document.getElementById('btnGh');
    const ghTitle = document.getElementById('ghTitle');
    const ghLead = document.getElementById('ghLead');
    const ghCode = document.getElementById('ghCode');
    const ghErr = document.getElementById('ghErr');
    const ghProject = document.getElementById('ghProject');
    const ghMsg = document.getElementById('ghMsg');
    let ghPoll = 0;

    function ghShowErr(t) { ghErr.textContent = t || ''; }

    async function refreshGh() {
      try {
        const r = await fetch('/api/github/status');
        const d = await r.json();
        if (d.logged_in) {
          ghBtn.textContent = '@' + d.user;
          ghBtn.classList.add('on');
          ghTitle.textContent = 'Signed in as @' + d.user;
          ghLead.textContent = 'Commit and push this game to a GitHub repo.';
        } else {
          ghBtn.textContent = 'GitHub';
          ghBtn.classList.remove('on');
          ghTitle.textContent = 'GitHub';
          ghLead.textContent = d.install_hint
            ? ('Install the GitHub CLI first: ' + d.install_hint)
            : 'Sign in to commit and push your games.';
        }
        if (d.repo && d.repo.project && !ghProject.value) ghProject.value = d.repo.project;
        return d;
      } catch (e) {
        return null;
      }
    }

    ghBtn.onclick = () => { ghModal.classList.add('show'); refreshGh(); };
    document.getElementById('ghClose').onclick = () => {
      ghModal.classList.remove('show');
      clearInterval(ghPoll);
    };
    ghModal.addEventListener('click', (e) => {
      if (e.target === ghModal) { ghModal.classList.remove('show'); clearInterval(ghPoll); }
    });

    document.getElementById('ghLogin').onclick = async () => {
      ghShowErr('');
      const token = document.getElementById('ghToken').value.trim();
      const r = await fetch('/api/github/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(token ? { token } : {}),
      });
      const d = await r.json();
      if (d.already || d.logged_in) {
        await refreshGh();
        return;
      }
      if (d.error && !d.user_code) {
        ghShowErr(d.error);
        return;
      }
      if (d.user_code) {
        ghCode.hidden = false;
        ghCode.textContent = d.user_code;
        ghLead.innerHTML = 'Enter this code at <a href="' + (d.verification_uri || 'https://github.com/login/device') + '" target="_blank" rel="noopener">github.com/login/device</a>';
      }
      clearInterval(ghPoll);
      ghPoll = setInterval(async () => {
        const s = await fetch('/api/github/login').then(x => x.json()).catch(() => ({}));
        if (s.user_code) {
          ghCode.hidden = false;
          ghCode.textContent = s.user_code;
        }
        if (s.done || s.logged_in) {
          clearInterval(ghPoll);
          if (s.error) ghShowErr(s.error);
          await refreshGh();
          if (s.logged_in) {
            ghCode.hidden = true;
            ghLead.textContent = 'Signed in. Ship when the slice is fun.';
          }
        }
      }, 1500);
    };

    document.getElementById('ghShip').onclick = async () => {
      ghShowErr('');
      const project = ghProject.value.trim();
      if (!project) { ghShowErr('Set the game folder path.'); return; }
      const r = await fetch('/api/github/ship', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          project,
          message: ghMsg.value.trim() || undefined,
          private: document.getElementById('ghPrivate').checked,
        }),
      });
      const d = await r.json();
      if (!d.ok) { ghShowErr(d.error || 'ship failed'); return; }
      ghLead.innerHTML = d.html_url
        ? ('Pushed → <a href="' + d.html_url + '" target="_blank" rel="noopener">' + d.html_url + '</a>')
        : (d.message || 'Shipped.');
      addMsg('system', 'Shipped to GitHub' + (d.html_url ? ': ' + d.html_url : ''));
    };

    checkHealth();
    refreshGh();
    setInterval(checkHealth, 8000);
    input.focus();
  </script>
</body>
</html>
