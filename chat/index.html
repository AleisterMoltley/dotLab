<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gamemaster</title>
  <style>
    :root {
      --bg: #07080c;
      --panel: #101218;
      --panel2: #161922;
      --line: #262a35;
      --text: #eef1f6;
      --muted: #8b93a7;
      --mint: #5ee9b5;
      --mint-dim: #0d2b22;
      --sky: #5ec8ff;
      --warn: #f5c16c;
      --bad: #ff7a7a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      grid-template-rows: 56px 1fr;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; border-bottom: 1px solid var(--line);
      background: #0c0e14;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(145deg, var(--mint), var(--sky));
      color: #042016; font-weight: 900; font-size: 11px;
      display: grid; place-items: center; letter-spacing: .04em;
    }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 700; }
    .brand p { margin: 1px 0 0; font-size: 11px; color: var(--muted); }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .status {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted);
      padding: 6px 12px; border: 1px solid var(--line);
      border-radius: 999px; background: var(--panel);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
    .dot.ok { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
    .dot.bad { background: var(--bad); }
    button.ghost {
      appearance: none; border: 1px solid var(--line); background: var(--panel);
      color: var(--text); border-radius: 999px; padding: 6px 12px;
      font-size: 12px; font-weight: 650; cursor: pointer;
    }
    button.ghost:hover { border-color: #3a4152; }

    #desk {
      display: grid;
      grid-template-columns: 232px 1fr;
      min-height: 0;
    }
    aside {
      border-right: 1px solid var(--line);
      background: #0b0d12;
      padding: 14px 12px 20px;
      overflow: auto;
    }
    aside h2 {
      margin: 16px 0 8px; font-size: 10px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted); font-weight: 700;
    }
    aside h2:first-child { margin-top: 0; }
    aside button.act {
      width: 100%; text-align: left;
      background: var(--panel); border: 1px solid var(--line);
      color: var(--text); border-radius: 10px;
      padding: 9px 10px; margin: 0 0 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    aside button.act:hover { border-color: #3d4558; background: var(--panel2); }
    aside button.act small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; margin-top: 2px; }
    #project {
      width: 100%; background: #07080c; color: var(--text);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 10px; font: 12px ui-monospace, Menlo, monospace;
    }

    .col {
      min-width: 0; display: grid;
      grid-template-rows: 1fr auto;
    }
    #log {
      overflow: auto; padding: 22px 24px 12px;
      max-width: 920px; width: 100%; margin: 0 auto;
    }
    .msg {
      margin: 0 0 12px; padding: 12px 14px;
      border-radius: 12px; border: 1px solid var(--line);
      background: var(--panel); line-height: 1.55;
    }
    .msg.user { background: #121a28; margin-left: 14%; }
    .msg.bot { background: #101410; margin-right: 8%; }
    .msg.system {
      background: transparent; border-style: dashed;
      color: var(--muted); text-align: center; font-size: 13px;
    }
    .msg .role {
      font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); font-weight: 700; margin-bottom: 6px;
    }
    .msg.bot .role { color: var(--mint); }
    .msg.user .role { color: var(--sky); }
    .msg .body { white-space: pre-wrap; word-break: break-word; }
    .msg pre {
      background: #07080c; border: 1px solid var(--line);
      border-radius: 8px; padding: 10px; overflow-x: auto;
      font-size: 12px; margin: 8px 0 0;
    }
    .welcome {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin: 16px 0 8px;
    }
    .welcome button {
      text-align: left; background: var(--panel2);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; color: var(--text); cursor: pointer;
    }
    .welcome button:hover { border-color: #4a5368; }
    .welcome strong { display: block; margin-bottom: 4px; }
    .welcome span { color: var(--muted); font-size: 12px; }

    .dock {
      border-top: 1px solid var(--line);
      background: #0c0e14;
      padding: 12px 16px 16px;
    }
    #composer {
      max-width: 920px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr auto;
      gap: 10px; align-items: end;
    }
    #input {
      width: 100%; min-height: 64px; max-height: 180px; resize: vertical;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; font: inherit; outline: none;
    }
    #input:focus { border-color: #3d6a88; box-shadow: 0 0 0 3px rgba(94,200,255,.12); }
    #send {
      appearance: none; border: 0; height: 64px; min-width: 108px;
      border-radius: 12px; font-weight: 800; cursor: pointer;
      background: linear-gradient(160deg, var(--mint), #2fbf86);
      color: #042016;
    }
    #send:disabled { opacity: .45; cursor: wait; }
    .hint { max-width: 920px; margin: 8px auto 0; color: var(--muted); font-size: 11px; }

    .modal-bg {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(0,0,0,.55); display: none; place-items: center; padding: 20px;
    }
    .modal-bg.show { display: grid; }
    .modal {
      width: min(440px, 100%); background: var(--panel);
      border: 1px solid var(--line); border-radius: 16px; padding: 18px;
    }
    .modal h2 { margin: 0 0 6px; font-size: 16px; }
    .modal p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .modal label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; }
    .modal input {
      width: 100%; background: #07080c; color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit;
    }
    .modal .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .modal .row button {
      flex: 1; min-width: 100px; height: 40px; border-radius: 10px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--line); background: #18181f; color: var(--text);
    }
    .modal .row button.primary { background: var(--mint); color: #042016; border: 0; }
    .modal .err { color: var(--bad); font-size: 12px; min-height: 1.2em; }

    @media (max-width: 800px) {
      #desk { grid-template-columns: 1fr; }
      aside { display: none; }
      .welcome { grid-template-columns: 1fr; }
    }
  </style>
  <script>
    /* Tiny boot — works even if app.js fails to load. */
    window.GM = window.GM || {};
    window.GM.bootSend = function (ev) {
      if (ev) ev.preventDefault();
      if (window.GM.send) { window.GM.send(); return false; }
      var ta = document.getElementById('input');
      var log = document.getElementById('log');
      var btn = document.getElementById('send');
      var text = (ta && ta.value || '').replace(/^\s+|\s+$/g, '');
      if (!text || !log) return false;
      ta.value = '';
      if (btn) btn.disabled = true;
      var u = document.createElement('div');
      u.className = 'msg user';
      u.innerHTML = '<div class="role">You</div><div class="body"></div>';
      u.querySelector('.body').textContent = text;
      log.appendChild(u);
      var b = document.createElement('div');
      b.className = 'msg bot';
      b.innerHTML = '<div class="role">Gamemaster</div><div class="body">…</div>';
      log.appendChild(b);
      log.scrollTop = log.scrollHeight;
      fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: 'user', content: text }] })
      }).then(function (r) { return r.json(); }).then(function (d) {
        b.querySelector('.body').textContent = (d && (d.text || d.error)) || 'No reply';
      }).catch(function (e) {
        b.querySelector('.body').textContent = 'Error: ' + e;
      }).then(function () {
        if (btn) btn.disabled = false;
        if (ta) ta.focus();
      });
      return false;
    };
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">GM</div>
      <div>
        <h1>Gamemaster</h1>
        <p>Local Three.js studio</p>
      </div>
    </div>
    <div class="header-right">
      <button type="button" class="ghost" id="btnGh">GitHub</button>
      <div class="status" id="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">starting…</span>
      </div>
    </div>
  </header>

  <div id="desk">
    <aside>
      <h2>Project</h2>
      <input id="project" type="text" placeholder="/path/to/game" spellcheck="false" />

      <h2>New slice</h2>
      <button type="button" class="act" data-fill="Walkable village: WASD, spring camera, one NPC with a 3-node dialogue tree, ragdoll on death.">
        Village walk<small>Talk, flag, retry</small>
      </button>
      <button type="button" class="act" data-fill="Tight platformer: coyote 100ms, jump buffer 90ms, gravity 26, one juice hitstop.">
        Platformer feel<small>Coyote + buffer</small>
      </button>
      <button type="button" class="act" data-fill="Pixel grove: bakeCanvas sprites on nearest quads, WASD, CONFIG feel knobs.">
        Pixel grove<small>Bake, then Three.js</small>
      </button>
      <button type="button" class="act" data-fill="Multipass water shader: Buffer A feedback, Image composite, no examples/jsm.">
        Shader lab<small>Multipass GLSL</small>
      </button>

      <h2>Studio</h2>
      <button type="button" class="act" data-fill="Studio plan: one verb at t=8s, kill list, CONFIG numbers, first fair death.">
        Plan<small>Director + architect</small>
      </button>
      <button type="button" class="act" data-fill="Implement a complete vertical slice now. Complete files. CONFIG. fog=bg. No holes.">
        Build<small>Write the slice</small>
      </button>
    </aside>

    <div class="col">
      <div id="log">
        <div class="msg system">Tell it the game. One verb. What the player does at 8 seconds.</div>
        <div class="welcome">
          <button type="button" data-fill="Third-person village: walk, talk to one NPC, ragdoll on death, fog matches background.">
            <strong>Open world</strong>
            <span>Walk, talk, one flag that changes the place</span>
          </button>
          <button type="button" data-fill="One-thumb runner: lane switch, jump, first death in 20s, restart under 3s, juice on hit.">
            <strong>Runner</strong>
            <span>One thumb, fair first death, juice</span>
          </button>
        </div>
      </div>
      <div class="dock">
        <form id="composer" action="/api/ask" method="post" onsubmit="return window.GM.bootSend(event)">
          <textarea id="input" name="q" rows="3" required placeholder="What does the player do?"></textarea>
          <button type="submit" id="send">Send</button>
        </form>
        <div class="hint">Enter sends · Shift+Enter newline · local Ollama, $0 unless you turned cloud on</div>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="ghModal">
    <div class="modal">
      <h2 id="ghTitle">GitHub</h2>
      <p id="ghLead">Sign in to commit and push a game.</p>
      <label for="ghProject">Game folder</label>
      <input id="ghProject" type="text" placeholder="/Users/you/Gamemaster/Projects/Wilds" />
      <label for="ghMsg">Commit message</label>
      <input id="ghMsg" type="text" placeholder="vertical slice" />
      <label class="check" style="display:flex;align-items:center;gap:8px;margin-top:10px">
        <input id="ghPrivate" type="checkbox" checked /> Private repo
      </label>
      <div class="err" id="ghErr"></div>
      <div class="row">
        <button type="button" id="ghLogin">Sign in</button>
        <button type="button" class="primary" id="ghShip">Ship</button>
        <button type="button" id="ghClose">Close</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
